name: train-model
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r python/requirements.txt
      - name: Download data
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download data-v1 --pattern "*.zip" --dir data
      - name: Build dataset
        working-directory: python
        run: |
          python data_loader.py ../data/*.zip m15.parquet
          python build_multi.py m15.parquet multi
      - name: Make model
        working-directory: python
        run: python make_model.py multi_H1.parquet ../model | tee model_report.txt
      - name: Commit model
        run: |
          git config user.name "gold-bot"
          git config user.email "gold-bot@users.noreply.github.com"
          git add model
          git commit -m "update model" || echo "nothing to commit"
          git push
      - name: Summary
        run: |
          { echo '```'; cat python/model_report.txt; echo '```'; } >> $GITHUB_STEP_SUMMARY
