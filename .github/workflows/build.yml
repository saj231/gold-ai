name: build-dataset
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r python/requirements.txt
      - name: Download data
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download data-v1 --pattern "*.zip" --dir data
      - name: Build M15
        working-directory: python
        run: python data_loader.py ../data/*.zip m15.parquet
      - name: Build multi-style dataset
        working-directory: python
        run: python build_multi.py m15.parquet multi | tee build_report.txt
      - name: Train and evaluate
        working-directory: python
        run: python train_multi.py multi H1 H4 | tee train_report.txt
      - name: Summary
        working-directory: python
        run: |
          { echo '```'; cat train_report.txt; echo; cat build_report.txt; echo '```'; } >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: multi
          path: |
            python/multi_*.parquet
            python/multi_report.json
            python/build_report.txt
            python/train_report.txt
