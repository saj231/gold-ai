
name: gold-scanner

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "scan or test"
        required: true
        default: "scan"
        type: choice
        options:
          - scan
          - test
      chat_id:
        description: "Telegram chat ID for this requested scan"
        required: false
        type: string

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r python/requirements.txt

      - name: Run gold scanner
        working-directory: python
        env:
          MODE: ${{ inputs.mode || 'scan' }}
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.chat_id || secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scan.py
